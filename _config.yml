title: DevNotes
description: Your Step-by-Step Roadmap for Developer Success!
author: DevNotes

# Theme
remote_theme: just-the-docs/just-the-docs

# Theme Settings
search_enabled: true
search:
  heading_level: 2
  previews: 3
  
color_scheme: dark

# Navigation
back_to_top: true
back_to_top_text: "Back to top"

# Aux Links (Top right)
aux_links:
  "GitHub Repository": "https://github.com/DeveloperDotLalit/professional-notes"

# Footer
footer_content: "Copyright &copy; 2024 DevNotes. All rights reserved."

# Permalinks
permalink: /:path/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"


plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge


